name: Synthetic lab verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  isolated-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (SHA-pinned v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python (SHA-pinned v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install local-lab dependencies
        run: python -m pip install -r requirements-lab.txt
      - name: Replay synthetic Before and After in disposable processes
        run: bash scripts/reproduce_all.sh
      - name: Validate evidence counts, checksums and disclosures
        run: python scripts/validate_portfolio.py
